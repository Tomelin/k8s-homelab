---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: provisioning
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: provisioning cluster addons
  destinations:
  - name: '*'
    namespace: '*'
    server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - https://github.com/Tomelin/k8s-homelab
  - https://kubernetes-sigs.github.io/metrics-server
---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provisioning-applications
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    path: deploy/applications
    repoURL: https://github.com/Tomelin/k8s-homelab.git
    targetRevision: main
    directory:
      recurse: true
  sources: []
  project: provisioning
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      enabled: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
