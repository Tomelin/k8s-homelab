
---
version: v1alpha1 # Indicates the schema used to decode the contents.
debug: false # Enable verbose logging to the console.
persist: true
machine:
    type: controlplane # Defines the role of the machine within the cluster.
    token: d8sbw5.9c9twnv22b3u9mxt # The `token` is used by a machine to join the PKI of the cluster.
    ca:
        crt: 
        key: LS0tLS1CRUdJTiBFRDI1NTE5IFBSSVZBVEUgS0VZLS0tLS0KTUM0Q0FRQXdCUVlESzJWd0JDSUVJUE11SU9kUTZzTDNzUG1JS1gwTFJIMG1NSnYxOHV0RFZHUzJoSURXM3FULwotLS0tLUVORCBFRDI1NTE5IFBSSVZBVEUgS0VZLS0tLS0K
    certSANs: []

    # Used to provide additional options to the kubelet.
    kubelet:
      image: ghcr.io/siderolabs/kubelet:v1.35.2 # The `image` field is an optional reference to an alternative kubelet image.
      defaultRuntimeSeccompProfileEnabled: true # Enable container runtime default Seccomp profile.
      disableManifestsDirectory: true # The `disableManifestsDirectory` field configures the kubelet to get static pod manifests from the /etc/kubernetes/manifests directory.
      extraArgs:
          rotate-server-certificates: "true"
      extraConfig:
          serverTLSBootstrap: true
    network:
      nameservers:
        - 8.8.8.8
        - 8.8.4.4
        - 1.1.1.1

    install:
        disk: /dev/sda # The disk used for installations.
        image: ghcr.io/siderolabs/installer:v1.12.5 # Allows for supplying the image used to perform the installation.
        wipe: false # Indicates if the installation disk should be wiped at installation time.
        grubUseUKICmdline: true # Indicates if legacy GRUB bootloader should use kernel cmdline from the UKI instead of building it on the host.
        
    features:
        diskQuotaSupport: true # Enable XFS project quota support for EPHEMERAL partition and user disks.
        kubePrism:
            enabled: true # Enable KubePrism support - will start local load balancing proxy.
            port: 7445 # KubePrism port.
        hostDNS:
            enabled: true # Enable host DNS caching resolver.
            forwardKubeDNSToHost: true # Use the host DNS resolver as upstream for Kubernetes CoreDNS pods.
    nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
    sysctls:
        net.netfilter.nf_conntrack_max: "1048576"
        net.netfilter.nf_conntrack_tcp_timeout_established: "86400"
cluster:
    id: DKi9cfssyaORzYUQGmTVgjb5Sl1FlU6QZ0e_PAEu0qo= # Globally unique identifier for this cluster (base64 encoded random 32 bytes).
    secret: uHiUwyDcG2Zdo11JSEg5ytcYOkBYOSF7AOTXrFWL1ac= # Shared secret of cluster (base64 encoded random 32 bytes).
    controlPlane:
        endpoint: https://192.168.0.150:6443 # Endpoint is the canonical controlplane endpoint, which can be an IP address or a DNS hostname.
    clusterName: homelabs # Configures the cluster's name.
    network:
        dnsDomain: cluster.local # The domain used by Kubernetes DNS.
        podSubnets:
            - 10.244.0.0/16
        serviceSubnets:
            - 10.96.0.0/12
    token: nwmr3j.jt621lmdgpbv2occ # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
    secretboxEncryptionSecret: 6+Hs2yd0ttTh0ZKYrE07fo0K1BKyfFn+Kwknj6/iVs4= # A key used for the [encryption of secret data at rest](https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/).
    ca:
        crt: 
        key: 
    aggregatorCA:
        crt: 
        key: 
    serviceAccount:
        key: 
    apiServer:
        image: registry.k8s.io/kube-apiserver:v1.35.2 # The container image used in the API server manifest.
        admissionControl:
            - name: PodSecurity # Name is the name of the admission controller.
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                defaults:
                    audit: restricted
                    audit-version: latest
                    enforce: baseline
                    enforce-version: latest
                    warn: restricted
                    warn-version: latest
                exemptions:
                    namespaces:
                        - kube-system
                    runtimeClasses: []
                    usernames: []
                kind: PodSecurityConfiguration
        auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
                - level: Metadata
    controllerManager:
        image: registry.k8s.io/kube-controller-manager:v1.35.2 # The container image used in the controller manager manifest.
    proxy:
        image: registry.k8s.io/kube-proxy:v1.35.2 # The container image used in the kube-proxy manifest.
        mode: ipvs
        extraArgs:
            proxy-mode: ipvs
            ipvs-scheduler: rr
            ipvs-min-sync-period: "1s"
            ipvs-sync-period: "30s"
            metrics-bind-address: "0.0.0.0:10249"
            nodeport-addresses: "192.168.0.150/27"
            conntrack-max-per-core: "65536"
            conntrack-min: "131072"
            conntrack-tcp-timeout-established: "86400s"
    scheduler:
        image: registry.k8s.io/kube-scheduler:v1.35.2 # The container image used in the scheduler manifest.
    discovery:
        enabled: true # Enable the cluster membership discovery feature.
        registries:
            kubernetes:
                disabled: true # Disable Kubernetes discovery registry.
            service: {}
    etcd:
        ca:
            crt: 
            key: 
    extraManifests: []
    inlineManifests: []
    allowSchedulingOnControlPlanes: true
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: stable
