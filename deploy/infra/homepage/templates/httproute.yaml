{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httproute.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    external-dns.alpha.kubernetes.io/target: {{ .Values.httproute.externalDNSTarget | quote }}
    gethomepage.dev/description: Synera homelab dashboard
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: homepage.png
    gethomepage.dev/name: Homepage
spec:
  hostnames:
    - {{ .Values.httproute.hostname | quote }}
  parentRefs:
    {{- toYaml .Values.httproute.parentRefs | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "homepage.fullname" . }}
          namespace: {{ .Values.namespace }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
