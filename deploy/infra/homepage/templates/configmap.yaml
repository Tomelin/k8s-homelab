apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homepage.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.config }}
  {{ $name }}: |
{{- if $content }}
{{ $content | nindent 4 }}
{{- else }}
{{ "" | nindent 4 }}
{{- end }}
  {{- end }}
