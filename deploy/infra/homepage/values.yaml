replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest
  pullPolicy: Always

namespace: homepage

serviceAccount:
  create: true
  automountServiceAccountToken: true

service:
  type: ClusterIP
  port: 3000
  targetPort: http

httproute:
  enabled: true
  name: homepage
  hostname: ihome.synera.com.br
  externalDNSTarget: "192.168.0.171"
  parentRefs:
    - name: internal-https
      namespace: envoy-gateway
      sectionName: http
    - name: internal-https
      namespace: envoy-gateway
      sectionName: internal-https

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

config:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Synera Home
    language: pt-BR
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - GitOps & Automation:
        - ArgoCD:
            href: https://argo.synera.com.br
            description: GitOps control plane
            icon: argo-cd.png
        - Workflows:
            href: https://workflows.synera.com.br
            description: Workflow automation
            icon: argo-workflows.png
        - GitHUB:
            href: https://github.synera.com.br
            description: Source code management
            icon: github.png
    - Platform & Identity:
        - Platform UI:
            href: https://platform.synera.com.br
            description: Synera platform portal
            icon: kubernetes.png
        - Kratos:
            href: https://auth.synera.com.br
            description: Identity and authentication
            icon: ory.png
        - Loackari Vault:
            href: http://vault.synera.com.br
            description: Secrets management
            icon: vault.png
        - KubeDiscovery:
            href: https://kubediscovery.synera.com.br
            description: Kubernetes discovery portal
            icon: kubernetes.png
        - Synera-docs:
            href: https://docs.synera.com.br
            description: Synera documentation
            icon: bookstack.png
    - Registry & Data:
        - Harbor:
            href: https://registry.synera.com.br
            description: Container registry
            icon: harbor.png
        - PGAdmin:
            href: http://psql.synera.com.br
            description: PostgreSQL administration
            icon: postgres.png
    - Observability & Cost:
        - Cost Optimizer:
            href: http://cost-optimizer.synera.com.br
            description: Cost optimization dashboard
            icon: opencost.png
        - Prometheus:
            href: http://prometheus.synera.com.br
            description: Metrics and alerting
            icon: prometheus.png
        - Grafana:
            href: http://grafana.synera.com.br
            description: Observability dashboards
            icon: grafana.png
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
