replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest
  pullPolicy: Always

namespace: homepage

serviceAccount:
  create: true
  automountServiceAccountToken: true

service:
  type: ClusterIP
  port: 3000
  targetPort: http

httproute:
  enabled: true
  name: homepage
  hostname: ihome.synera.com.br
  externalDNSTarget: "192.168.0.171"
  parentRefs:
    - name: internal-https
      namespace: envoy-gateway
      sectionName: http
    - name: internal-https
      namespace: envoy-gateway
      sectionName: internal-https

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

config:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Tomelin HomeLabs
    language: pt-BR
    background:
      image:  https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
      opacity: 50
      blur: md
      brightness: 50
      saturate: 50
    layout:
      Platforms:
        style: row
        columns: 4
      Workflows:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 4

  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Platforms:
      - IDP:
          href: https://idp.synera.com.br/
          description: Identity Developer Portal with Backstage
          icon: notediscovery.png
      - Lockari Vault:
          href: https://vault.synera.com.br/
          description: Secrets management
          icon: vault.png
      - Kube Discovery:
          href: https://discovery.synera.com.br/
          description: Cluster inventory and documentation
          icon: searxng.png
      - Synera:
          href: https://synera.com.br/
          description: Synera website
          icon: notediscovery.png
      - AI WEB UI:
          href: https://synera.com.br/
          description: Integration Automation with AI Platform
          icon: flowise.png
    - Workflows:
        - Argo CD:
            href: https://ops.synera.com.br/
            description: GitOps control plane
            icon: argo-cd.png
        - Argo Workflows:
            href: https://ops.synera.com.br/
            description: GitOps Workflows
            icon:  argo-cd.png
        - Argo Events:
            href: https://ops.synera.com.br/
            description: Trigger and Events
            icon:  argo-cd.png
        - Github Actions:
            href: https://github.com/
            description: Github Actions
            icon: github.svg
    - Infrastructure:
      - CloudFlared:
          href: https://pihole.synera.com.br/
          description: DNS
          icon: cloudflared.svg
      - Kube WEB UI:
          href: https://portainer.synera.com.br/
          description: Container management
          icon: kubernetes.png
      - Container Registry:
          href: https://portainer.synera.com.br/
          description: Container Registry
          icon: harbor.svg
      - Cost Management:
          href: https://kubernetes.default.svc
          description: Cost Management
          icon: opencost.png
      - PG Admin:
            href: https://kubernetes.default.svc
            description: PostgreSQL Admin
            icon: postgresql.svg
    - Monitoring:
        - Prometheus:
            href: https://kubernetes.default.svc
            description: Metrics and alerting
            icon: prometheus.png
        - Alertmanager:
            href: https://kubernetes.default.svc
            description: Alert rules and notifications
            icon: prometheus.png
        - Grafana:
            href: https://kubernetes.default.svc
            description: Visualization and dashboards
            icon: grafana.png
        - Metrics:
            href: https://kubernetes.default.svc
            description: Kubernetes cluster
            icon: tempo.svg

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
  docker.yaml: "{}"
  proxmox.yaml: "{}"
