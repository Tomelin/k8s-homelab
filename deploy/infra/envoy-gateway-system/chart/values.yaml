gatewayapi:
  global:
    imageRegistry: ""
    imagePullSecrets: []

  kubernetesClusterDomain: cluster.local

  commonLabels:
    type: addons

  deployment:
    replicas: 1

  hpa:
    enabled: true
    maxReplicas: 5

  config:
    extensionApis: {}
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes
      # Envoy Gateway Admin Console is built in to the control plane since Envoy Gateway v1.5.
      # Keep it bound to localhost and access it through kubectl port-forward:
      # kubectl port-forward -n envoy-gateway-system deployment/envoy-gateway 19000:19000
      admin:
        address:
          host: "0.0.0.0"
          port: 19000
        enablePprof: true
      logging:
        level:
          default: info
