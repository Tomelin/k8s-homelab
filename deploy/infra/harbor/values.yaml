harbor:
  ipFamily:
    ipv4:
      enabled: "true"
    ipv6:
      enabled: "false"

  externalURL: https://registry.synera.com.br
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  persistence:
    enabled: true
    resourcePolicy: "keep"
    persistentVolumeClaim:
      registry:
        existingClaim: "registry-pvc"
      database:
        existingClaim: "database-pvc"
      
      jobservice:
        jobLog:
          storageClass: "database" # Vai precisar de um PV manual chamado 'jobservice-pv'
          size: 1Gi
      
      redis:
        storageClass: "database" # Vai precisar de um PV manual chamado 'redis-pv'
        size: 1Gi
      
      trivy:
        storageClass: "database" # Vai precisar de um PV manual chamado 'trivy-pv'
        size: 5Gi

    imageChartStorage:
      type: filesystem


httpRoute:
  enabled: true
  hostnames:
  - registry.synera.com.br
  externalDNSTarget: "186.216.247.16"