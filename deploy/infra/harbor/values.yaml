harbor:
  ipFamily:
    ipv4:
      enabled: "true"
    ipv6:
      enabled: "false"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  persistence:
    enabled: true
    # 'keep' evita que os PVCs sejam deletados se você desinstalar o Helm (segurança de dados)
    resourcePolicy: "keep"
    
    persistentVolumeClaim:
      registry:
        # Aqui usamos o PVC que você criou: 'registry-pvc'
        existingClaim: "registry-pvc"
        #storageClass: "registry"

      database:
        # Aqui usamos o seu outro PVC: 'database-pvc'
        existingClaim: "database-pvc"
        #storageClass: "database"
        size: 20Gi
      
      # Para os componentes abaixo, como você não criou PVCs manuais ainda, 
      # o Harbor tentará criá-los automaticamente usando a StorageClass informada.
      jobservice:
        jobLog:
          storageClass: "database"
          size: 1Gi
          # existingClaim: database-pvc
      
      redis:
        storageClass: "database"
        size: 1Gi
        # existingClaim: database-pvc
      
      trivy:
        storageClass: "database"
        size: 5Gi
        # existingClaim: database-pvc

    imageChartStorage:
      # Obrigatório ser 'filesystem' para usar os volumes que você configurou
      type: filesystem

httpRoute:
  enabled: true
  hostnames:
  - registry.synera.com.br
  externalDNSTarget: "186.216.247.16"