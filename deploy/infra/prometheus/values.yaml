
prometheus:
  # Desabilita o Pushgateway que também pode pedir disco
  pushgateway:
    enabled: false
  
  alertmanager:
    enabled: true
    persistence:
      enabled: false
    # Algumas versões usam 'persistentVolume' outras 'persistence'
    persistentVolume:
      enabled: false
    emptyDir:
      medium: "Memory"

  server:
    enabled: true
    persistence:
      enabled: false
    persistentVolume:
      enabled: false
    emptyDir:
      medium: "Memory"
    ingress:
      enabled: false

gatewayAPI:
  enabled: false
  name: envoy-gateway-envoy-gateway
  namespace: envoy-gateway-system
  sectionName: https
  domains:
  - prometheus.domain.com
