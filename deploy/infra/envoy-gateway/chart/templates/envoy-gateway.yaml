---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-envoy-gateway
  labels:
    last-change: add-annotation
  annotations:
    {{- if .Values.externalIP.enabled }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.externalIP.address | quote }}
    {{- end }}
spec:
  gatewayClassName: {{ .Values.envoyConfig.gatewayClass }}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
        - name: secret-tls
          namespace: envoy-gateway-system
    allowedRoutes:
      namespaces:
        from: All