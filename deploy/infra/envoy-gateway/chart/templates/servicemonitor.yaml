{{- if .Values.telemetry.metrics.prometheus.enabled }}
{{- $root := . -}}
{{- range $key, $gateway := .Values.gateways }}
{{- if $gateway.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $gateway.name }}-envoy-proxy
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- toYaml $root.Values.labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: {{ $gateway.name }}
      gateway.envoyproxy.io/owning-gateway-namespace: {{ $root.Values.namespace }}
  namespaceSelector:
    matchNames:
      - {{ $root.Values.managedNamespace }}
  podMetricsEndpoints:
    - port: {{ $root.Values.telemetry.metrics.prometheus.portName | quote }}
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
{{- end }}
{{- end }}