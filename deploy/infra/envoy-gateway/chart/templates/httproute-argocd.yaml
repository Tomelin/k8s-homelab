{{- if .Values.argocd.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: argocd-https
  namespace: argocd
spec:
  hostnames:
  {{- range .Values.argocd.hostnames }}
  - {{ . }}
  {{- end }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway-envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      namespace: argocd
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
{{- end -}}
