apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: argocd-https
  namespace: argocd
spec:
  hostnames:
  - gitops.synera.com.br
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway-envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
