{{- if .Values.argocd.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: argocd-https
  namespace: argocd
spec:
  hostnames:
    {{- range .Values.argocd.hostnames }}
  - {{ . }}
    {{- end }}
  parentRefs:
    - name: https
      namespace: {{ .Values.namespace }}
      sectionName: https
    - name: http
      namespace: {{ .Values.namespace }}
      sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      namespace: argocd
      port: 80
      weight: 1
{{- end }}