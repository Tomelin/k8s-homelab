{{- if .Values.gateways.plainHttps.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateways.plainHttps.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
  annotations:
    {{- toYaml .Values.gateways.plainHttps.annotations | nindent 4 }}
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gateways.plainHttps.envoyProxyName }}
  listeners:
    - name: {{ .Values.gateways.plainHttps.listenerName }}
      protocol: {{ .Values.gateways.plainHttps.protocol }}
      port: {{ .Values.gateways.plainHttps.port }}
      hostname: {{ .Values.listenerHostname | quote }}
      tls:
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateways.plainHttps.secretTLSName }}
            namespace: {{ .Values.namespace }}
        mode: {{ .Values.gateways.plainHttps.mode }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
