envoyConfig:
  envoyServiceType: LoadBalancer
  envoyServiceName: envoy-gateway-service
  gatewayClass: envoy-gateway-class
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  serviceAnnotations:
    enabled: false
    annotations:
      metallb.io/address-pool: primary

externalIP:
  enabled: false
  address: YOUR-EXTERNAL-IP

argocd:
  enabled: true
  hostnames:
  - gitops.synera.com.br
  internalhostnames:
  - ops.synera.com.br
  - igitops.synera.com.br
  externalDNSTarget: "186.216.247.16"

namespace: envoy-gateway
# Namespace where the Envoy Gateway controller is installed
managedNamespace: envoy-gateway-system

# Wildcard hostname attached to each listener (SNI pattern for routing)
listenerHostname: "*.synera.com.br"

gateways:
  # TLS-Passthrough Gateway for mTLS workloads. Envoy reads SNI from
  # ClientHello and forwards encrypted bytes to the backend sidecar.
  # No certificateRefs — cert is presented by the destination sidecar.
  mtlsPassthrough:
    enabled: false
    name: mtls-passthrough
    listenerName: mtls
    port: 443
    envoyProxyName: mtls-proxy
    annotations: {}
    # Extra annotations merged on top of envoyProxy.service.annotations.
    serviceAnnotations:
      annotations:
        metallb.io/address-pool: primary
        external-dns.alpha.kubernetes.io/target: "186.216.247.16"
  # HTTP plain Gateway. TLS is terminated upstream by the NLB with an
  # ACM public wildcard cert (attached via aws-load-balancer-ssl-cert).
  # Envoy receives plain HTTP and routes by HTTPRoute host rules.
  plainHttp:
    enabled: false
    name: http
    listenerName: http
    port: 80
    envoyProxyName: http-proxy
    redirectHttps:
      enabled: false
    annotations:
      external-dns.alpha.kubernetes.io/target: "186.216.247.16"
    # Overridden per-env (see values/envoy-gateway-config/base.yaml.gotmpl).
    # The ssl-cert annotation carries the ACM ARN for TLS termination at the NLB.
    serviceAnnotations:
      metallb.io/address-pool: primary
      external-dns.alpha.kubernetes.io/target: "186.216.247.16"

  # plainHttps:
  #   enabled: true
  #   name: https
  #   listenerName: https
  #   port: 443
  #   envoyProxyName: https-proxy
  #   annotations:
  #     external-dns.alpha.kubernetes.io/target: "186.216.247.16"
  #   protocol: HTTPS
  #   secretTLSName: envoy-gateway-tls
  #   mode: Terminate
  #   # Overridden per-env (see values/envoy-gateway-config/base.yaml.gotmpl).
  #   # The ssl-cert annotation carries the ACM ARN for TLS termination at the NLB.
  #   serviceAnnotations:
  #     metallb.io/address-pool: primary
  #     external-dns.alpha.kubernetes.io/target: "186.216.247.16"
  plainHttps:
    enabled: true
    name: https
    listenerName: https
    port: 443
    envoyProxyName: https-proxy
    annotations:
      external-dns.alpha.kubernetes.io/target: "186.216.247.16"
    protocol: HTTPS
    secretTLSName: envoy-gateway-tls
    mode: Terminate
    # Overridden per-env (see values/envoy-gateway-config/base.yaml.gotmpl).
    # The ssl-cert annotation carries the ACM ARN for TLS termination at the NLB.
    serviceAnnotations:
      metallb.io/address-pool: primary
      external-dns.alpha.kubernetes.io/target: "186.216.247.16"
    domains:
      - name: "https"
        listenerHostname: "*.synera.com.br"
        secretTLSName: envoy-gateway-tls
      - name: "synera"
        listenerHostname: "*.synera.com.br"
        secretTLSName: envoy-gateway-tls
      - name: "kubediscovery"
        listenerHostname: "*.kubediscovery.com"
        secretTLSName: "envoy-gateway-tls"
  internalHttps:
    enabled: true
    name: internal-https
    listenerName: internal-https
    port: 443
    envoyProxyName: internal-https-proxy
    annotations:
      external-dns.alpha.kubernetes.io/target: "192.168.0.171"
    protocol: HTTPS
    secretTLSName: envoy-gateway-tls
    mode: Terminate
    # Overridden per-env (see values/envoy-gateway-config/base.yaml.gotmpl).
    # The ssl-cert annotation carries the ACM ARN for TLS termination at the NLB.
    serviceAnnotations:
      metallb.io/address-pool: internal
      external-dns.alpha.kubernetes.io/target: "192.168.0.171"
  plainTCP:
    enabled: true
    name: tcp-postgres
    listenerName: tcp-postgres
    port: 443
    envoyProxyName: tcp-proxy
    annotations:
      external-dns.alpha.kubernetes.io/target: "192.168.0.170"
    protocol: TCP
    mode: Terminate
    # Overridden per-env (see values/envoy-gateway-config/base.yaml.gotmpl).
    # The ssl-cert annotation carries the ACM ARN for TLS termination at the NLB.
    serviceAnnotations:
      metallb.io/address-pool: internal
      external-dns.alpha.kubernetes.io/target: "192.168.0.170"

envoyProxy:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  service:
    type: LoadBalancer
    # externalTrafficPolicy: Cluster allows traffic from any node (including the host machine
    # and external clients via NAT/router). Use Local only when source IP preservation is needed.
    externalTrafficPolicy: Cluster
    # # Common AWS LB Controller v2 annotations applied to every Gateway's NLB.
    annotations:
      metallb.io/address-pool: primary
    labels: {}

telemetry:
  metrics:
    prometheus:
      # Exposes /stats/prometheus on port 19001 (0.0.0.0).
      # Enables PodMonitor scraping for the Prometheus/Mimir stack.
      enabled: true
      # Port name on the Envoy Gateway managed Service. Verify after first deploy with:
      # kubectl get svc -n envoy-gateway -l gateway.envoyproxy.io/owning-gateway-name=<gateway> -o yaml
      portName: "metrics"
      dashboard:
        enabled: false
    openTelemetry:
      # Requires OTLP receiver enabled on the Datadog agent (port 4317).
      # Enable on clusters where Datadog is the metrics backend.
      enabled: false
      host: "datadog-agent.datadog.svc.cluster.local"
      port: 4317

# Regex used by PrometheusRule and Grafana dashboard to select the gateway pods'
# scrape job labels. PodMonitor generates job names like
# "<namespace>/<podmonitor-name>" — each gateway gets a PodMonitor named
# "<gateway>-envoy-proxy", so this regex catches both.
prometheusJobRegex: ".*-envoy-proxy.*"

labels:
  env: ""