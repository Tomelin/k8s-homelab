apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: provisioning
  sources:
    - repoURL: https://charts.jetstack.io
      targetRevision: v1.20.2
      chart: cert-manager
      helm:
        valueFiles:
          - $values/deploy/infra/cert-manager/values.yaml
        values: |
          crds:
            enabled: true
          global:
            leaderElection:
              namespace: cert-manager
          config:
            enableGatewayAPI: true
    - repoURL: https://github.com/Tomelin/k8s-homelab
      targetRevision: main
      ref: values

    # 3. Manifestos do Git (ClusterIssuer, etc)
    - repoURL: https://github.com/Tomelin/k8s-homelab
      targetRevision: main
      path: deploy/infra/cert-manager/manifests
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2