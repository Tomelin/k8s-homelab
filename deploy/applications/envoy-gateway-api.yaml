apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: provisioning
  sources:
    - repoURL: https://gateway.envoyproxy.io/charts 
      targetRevision: v1.5.9
      chart: gateway-crds-helm
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s