---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: provisioning
  namespace: argocd
spec:
  description: provisioning cluster addons
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  sourceRepos:
    - https://github.com/Tomelin/k8s-homelab
    - https://github.com/Tomelin/k8s-homelab.git
    - https://kubernetes-sigs.github.io/metrics-server
    - https://metallb.github.io/metallb
    - https://argoproj.github.io/argo-helm
    - https://postfinance.github.io/kubelet-csr-approver
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns
    - https://kubernetes.github.io/ingress-nginx

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: provisioning
  source:
    repoURL: https://github.com/Tomelin/k8s-homelab.git
    targetRevision: main
    path: deploy/applications
    directory:
      recurse: false
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
    syncOptions:
      - CreateNamespace=true
