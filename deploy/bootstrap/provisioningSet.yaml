apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: provisioningset-applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: metallb
            project: provisioning
            wave: "1"
          - name: envoy-gateway
            project: provisioning
            wave: "2"
  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: "{{.project}}"
      destination:
        namespace: argocd
        server: https://kubernetes.default.svc
      source:
        path: 'deploy/applications/{{.name}}'
        repoURL: https://github.com/Tomelin/k8s-homelab.git
        targetRevision: main
        directory:
          recurse: true
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
        retry:
          limit: 2
          backoff:
            duration: 5s
            maxDuration: 3m0s
            factor: 2
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true